<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NEXUS — Real-time Cryptocurrency Analytics Hub. Track live prices, manage your watchlist, and analyze market trends with a stunning glassmorphism interface.">
    <meta property="og:title" content="NEXUS — Real-time Data & Analytics Hub">
    <meta property="og:description" content="A high-performance cryptocurrency analytics dashboard with real-time data, smart filtering, and persistent watchlists.">
    <meta property="og:type" content="website">
    <title>NEXUS — Real-time Data & Analytics Hub</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
</head>
<body>
    <!-- Particle Canvas Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="navbar__brand">
            <div class="navbar__logo">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 2L37 11.5V30.5L20 40L3 30.5V11.5L20 2Z" stroke="url(#logo-gradient)" stroke-width="2.5" fill="none"/>
                    <path d="M20 8L31 14V28L20 34L9 28V14L20 8Z" stroke="url(#logo-gradient)" stroke-width="1.5" fill="none" opacity="0.6"/>
                    <path d="M20 14L25.5 17.5V24.5L20 28L14.5 24.5V17.5L20 14Z" fill="url(#logo-gradient)" opacity="0.4"/>
                    <defs>
                        <linearGradient id="logo-gradient" x1="3" y1="2" x2="37" y2="40">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="50%" stop-color="#a855f7"/>
                            <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <span class="navbar__title">NEXUS</span>
            <span class="navbar__badge">LIVE</span>
        </div>

        <div class="navbar__tabs">
            <button class="navbar__tab navbar__tab--active" data-tab="dashboard" id="tab-dashboard">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Dashboard
            </button>
            <button class="navbar__tab" data-tab="watchlist" id="tab-watchlist">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                Watchlist
                <span class="navbar__tab-count" id="watchlist-count" style="display:none;">0</span>
            </button>
        </div>

        <div class="navbar__actions">
            <button class="navbar__theme-toggle" id="theme-toggle" title="Toggle theme">
                <svg class="theme-icon theme-icon--dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="theme-icon theme-icon--light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <div class="navbar__refresh">
                <button class="btn btn--icon" id="refresh-btn" title="Refresh data">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </button>
                <span class="navbar__last-updated" id="last-updated">--:--</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <!-- Stats Dashboard -->
        <section class="stats" id="stats-section">
            <div class="stats__card stats__card--primary" id="stat-market-cap">
                <div class="stats__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="stats__content">
                    <span class="stats__label">Total Market Cap</span>
                    <span class="stats__value" id="stat-mcap-value">--</span>
                </div>
            </div>
            <div class="stats__card" id="stat-volume">
                <div class="stats__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                </div>
                <div class="stats__content">
                    <span class="stats__label">24h Volume</span>
                    <span class="stats__value" id="stat-volume-value">--</span>
                </div>
            </div>
            <div class="stats__card" id="stat-avg-change">
                <div class="stats__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
                <div class="stats__content">
                    <span class="stats__label">Avg 24h Change</span>
                    <span class="stats__value" id="stat-change-value">--</span>
                </div>
            </div>
            <div class="stats__card" id="stat-btc-dom">
                <div class="stats__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
                </div>
                <div class="stats__content">
                    <span class="stats__label">BTC Dominance</span>
                    <span class="stats__value" id="stat-btc-value">--</span>
                </div>
            </div>
        </section>

        <!-- Controls Bar -->
        <section class="controls" id="controls-section">
            <div class="controls__search">
                <svg class="controls__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="controls__search-input" id="search-input" placeholder="Search by name or symbol..." autocomplete="off">
                <button class="controls__search-clear" id="search-clear" style="display:none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="controls__actions">
                <div class="controls__sort">
                    <label class="controls__label">Sort by</label>
                    <div class="controls__sort-buttons">
                        <button class="sort-btn sort-btn--active" data-sort="rank" id="sort-rank">Rank</button>
                        <button class="sort-btn" data-sort="name" id="sort-name">Name</button>
                        <button class="sort-btn" data-sort="price" id="sort-price">Price</button>
                        <button class="sort-btn" data-sort="marketCap" id="sort-mcap">Market Cap</button>
                        <button class="sort-btn" data-sort="change" id="sort-change">24h %</button>
                    </div>
                </div>
                <button class="controls__direction-btn" id="sort-direction" title="Toggle sort direction">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
                </button>
            </div>
        </section>

        <!-- Cards Grid -->
        <section class="grid" id="cards-grid">
            <!-- Cards injected by JS -->
        </section>

        <!-- Empty State -->
        <section class="empty-state" id="empty-state" style="display:none;">
            <div class="empty-state__content">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                <h3 class="empty-state__title">No results found</h3>
                <p class="empty-state__text">Try adjusting your search or filters</p>
            </div>
        </section>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__content">
            <div class="footer__brand">
                <span class="footer__logo">⬡</span>
                <span>NEXUS</span>
            </div>
            <p class="footer__text">Real-time data powered by <a href="https://coincap.io" target="_blank" rel="noopener">CoinCap API</a></p>
            <p class="footer__copyright">© 2026 NEXUS Analytics. All rights reserved.</p>
        </div>
    </footer>

    <!-- App Scripts (ES6 Modules) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
