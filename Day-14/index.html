<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Number Guessing Game</h1>
        <p class="instructions">I'm thinking of a number between 1 and 100. Can you guess it?</p>
        
        <div class="game-info">
            <div class="info-item">
                <span class="label">Attempts Left:</span>
                <span id="attempts" class="value">10</span>
            </div>
            <div class="info-item">
                <span class="label">Guesses:</span>
                <span id="guessCount" class="value">0</span>
            </div>
        </div>

        <div class="game-area">
            <input type="number" id="guessInput" placeholder="Enter your guess (1-100)" min="1" max="100">
            <button id="guessButton">Guess</button>
        </div>

        <div id="message" class="message"></div>

        <div id="history" class="history">
            <h3>Your Guesses:</h3>
            <div id="guessList"></div>
        </div>

        <button id="restartButton" class="restart-button" style="display: none;">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
