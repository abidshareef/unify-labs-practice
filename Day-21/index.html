<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Settings Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light-theme">
    <div class="container">
        <header>
            <h1>Settings Manager</h1>
        </header>
        
        <main>
            <section class="settings-panel">
                <h2>User Preferences</h2>
                
                <div class="setting-item">
                    <label for="theme-toggle">Theme:</label>
                    <select id="theme-toggle">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
                
                <div class="setting-item">
                    <label for="language-select">Language:</label>
                    <select id="language-select">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                    </select>
                </div>
                
                <div class="setting-item">
                    <label for="notifications-toggle">Notifications:</label>
                    <input type="checkbox" id="notifications-toggle">
                </div>
                
                <button id="reset-settings">Reset to Defaults</button>
            </section>
            
            <section class="preview">
                <h2>Preview Content</h2>
                <p>This content will adapt based on your settings.</p>
                <div class="card">
                    <h3>Sample Card</h3>
                    <p>Notice how this card changes appearance with different themes.</p>
                </div>
            </section>
        </main>
    </div>
    
    <script src="script.js" type="module"></script>
</body>
</html>
